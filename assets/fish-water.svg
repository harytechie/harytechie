<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#071321"/><stop offset="100%" stop-color="#102d47"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0785a5"/><stop offset="55%" stop-color="#075a80"/><stop offset="100%" stop-color="#032f50"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="150" fill="url(#sky)"/>
<rect y="150" width="1200" height="150" fill="url(#water)"/>
<circle cx="1035" cy="52" r="38" fill="#ffd166" opacity=".14" filter="url(#glow)"/>
<circle cx="1035" cy="52" r="22" fill="#ffd166" opacity=".75"/>
<path d="M0 150 Q150 138 300 150 T600 150 T900 150 T1200 150 V166 H0Z" fill="#24c4df" opacity=".45">
<animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 150 Q150 138 300 150 T600 150 T900 150 T1200 150 V166 H0Z;M0 150 Q150 162 300 150 T600 150 T900 150 T1200 150 V166 H0Z;M0 150 Q150 138 300 150 T600 150 T900 150 T1200 150 V166 H0Z"/>
</path>
<text x="600" y="92" text-anchor="middle" fill="#e9fbff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Dive into my projects 🌊</text>

<!-- All fish remain BELOW the waterline and move ONLY left/right. -->
<g transform="translate(-120 205)"><g>
<path d="M0 0 Q27 -19 60 0 Q27 19 0 0Z" fill="#ff6b6b"/><path d="M0 0 L-25 -17 L-18 0 L-25 17Z" fill="#ff8c8c"/>
