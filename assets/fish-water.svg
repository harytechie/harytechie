</g>

<g fill="none" stroke="#9deeff" stroke-width="2" opacity=".65">
<circle cx="250" cy="250" r="5"><animate attributeName="cy" values="250;225;200;175" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.5;.25;0" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="270" cy="270" r="3"><animate attributeName="cy" values="270;245;220;195" dur="2.6s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;.4;.2;0" dur="2.6s" begin=".7s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="260" r="4"><animate attributeName="cy" values="260;235;210;185" dur="3.2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.45;.2;0" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
</g>
