<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09121f"/>
      <stop offset="100%" stop-color="#16314b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#087f9f"/>
      <stop offset="55%" stop-color="#075477"/>
      <stop offset="100%" stop-color="#032f4d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="150" fill="url(#sky)"/>

  <!-- water -->
  <rect y="150" width="1200" height="150" fill="url(#water)"/>

  <!-- animated water surface -->
  <path d="M0 150 Q150 135 300 150 T600 150 T900 150 T1200 150 V166 H0Z" fill="#19b7cf" opacity=".28">
    <animate attributeName="d"
      dur="5s" repeatCount="indefinite"
      values="M0 150 Q150 135 300 150 T600 150 T900 150 T1200 150 V166 H0Z;
              M0 150 Q150 164 300 150 T600 150 T900 150 T1200 150 V166 H0Z;
              M0 150 Q150 135 300 150 T600 150 T900 150 T1200 150 V166 H0Z"/>
  </path>

  <!-- sun glow -->
  <circle cx="1050" cy="55" r="34" fill="#ffd166" opacity=".16" filter="url(#glow)"/>
  <circle cx="1050" cy="55" r="22" fill="#ffd166" opacity=".65"/>

  <!-- diving fish 1 -->
  <g>
    <g transform="translate(235,-20)">
      <path d="M0 0 Q25 -18 55 0 Q25 18 0 0Z" fill="#ff6b6b"/>
      <path d="M0 0 L-22 -16 L-16 0 L-22 16Z" fill="#ff8c8c"/>
      <circle cx="42" cy="-5" r="3" fill="#fff"/>
      <circle cx="43" cy="-5" r="1.5" fill="#111"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 25 55; 45 105; 90 160; 145 190; 220 205"
      dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- diving fish 2 -->
  <g>
    <g transform="translate(720,5) rotate(8)">
      <path d="M0 0 Q24 -15 52 0 Q24 15 0 0Z" fill="#ffd166"/>
      <path d="M0 0 L-20 -14 L-15 0 L-20 14Z" fill="#ffe39a"/>
      <circle cx="40" cy="-4" r="3" fill="#fff"/>
      <circle cx="41" cy="-4" r="1.5" fill="#111"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -20 35; -40 85; -70 145; -115 190; -170 205"
      dur="5.2s" begin="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- underwater fish -->
  <g transform="translate(110 215)">
    <g>
      <path d="M0 0 Q32 -22 68 0 Q32 22 0 0Z" fill="#7bdff2"/>
      <path d="M0 0 L-25 -18 L-18 0 L-25 18Z" fill="#a8ecf8"/>
      <circle cx="52" cy="-6" r="3" fill="#fff"/>
      <circle cx="53" cy="-6" r="1.5" fill="#111"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 180 -8; 360 5; 540 -5; 720 0; 900 8"
        dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(920 255) scale(.75)">
    <path d="M0 0 Q32 -22 68 0 Q32 22 0 0Z" fill="#c77dff"/>
    <path d="M0 0 L-25 -18 L-18 0 L-25 18Z" fill="#dfadff"/>
    <circle cx="52" cy="-6" r="3" fill="#fff"/>
    <circle cx="53" cy="-6" r="1.5" fill="#111"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -180 -12; -360 5; -540 -5; -720 0"
      dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#b8f3ff" stroke-width="2" opacity=".7">
    <circle cx="310" cy="210" r="5">
      <animate attributeName="cy" values="210;175;140" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="230" r="3">
      <animate attributeName="cy" values="230;195;160" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="225" r="4">
      <animate attributeName="cy" values="225;185;150" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- seabed -->
  <path d="M0 288 Q120 270 240 290 T480 286 T720 292 T960 280 T1200 290 V300 H0Z" fill="#021f35"/>
  <circle cx="170" cy="275" r="10" fill="#22a06b" opacity=".7"/>
  <circle cx="185" cy="268" r="7" fill="#2fbf71" opacity=".6"/>
  <circle cx="1030" cy="278" r="11" fill="#22a06b" opacity=".7"/>

  <text x="600" y="125" text-anchor="middle" fill="#e9fbff" font-family="Arial, sans-serif" font-size="22" font-weight="700">
    Dive into my projects 🌊
  </text>
</svg>