<animateTransform attributeName="transform" type="translate" values="0 0;250 0;500 2;750 -1;1400 0" dur="11s" repeatCount="indefinite"/>
</g></g>

<g transform="translate(1280 235)"><g>
<path d="M0 0 Q30 -21 68 0 Q30 21 0 0Z" fill="#ffd166"/><path d="M0 0 L-27 -18 L-20 0 L-27 18Z" fill="#ffe39a"/>
<circle cx="53" cy="-5" r="3.2" fill="white"/><circle cx="54" cy="-5" r="1.5" fill="#111"/>
<animateTransform attributeName="transform" type="translate" values="0 0;-250 0;-500 -2;-750 1;-1450 0" dur="12s" repeatCount="indefinite"/>
</g></g>

<g transform="translate(-180 265)"><g>
<path d="M0 0 Q34 -23 76 0 Q34 23 0 0Z" fill="#62d7ee"/><path d="M0 0 L-28 -20 L-20 0 L-28 20Z" fill="#9debf6"/>
<circle cx="60" cy="-6" r="3.2" fill="white"/><circle cx="61" cy="-6" r="1.5" fill="#111"/>
<animateTransform attributeName="transform" type="translate" values="0 0;300 0;600 2;900 -1;1450 0" dur="13s" repeatCount="indefinite"/>
</g></g>

<g transform="translate(1300 190)"><g>
<path d="M0 0 Q26 -18 58 0 Q26 18 0 0Z" fill="#c77dff"/><path d="M0 0 L-24 -16 L-17 0 L-24 16Z" fill="#dfadff"/>
<circle cx="45" cy="-5" r="3" fill="white"/><circle cx="46" cy="-5" r="1.4" fill="#111"/>
<animateTransform attributeName="transform" type="translate" values="0 0;-300 0;-600 2;-900 -1;-1450 0" dur="10s" repeatCount="indefinite"/>
</g></g>

<g fill="#012b4a" opacity=".65">
<path d="M0 0 Q14 -9 28 0 Q14 9 0 0 L-12 -8 L-8 0 L-12 8Z"><animateTransform attributeName="transform" type="translate" values="980 255;850 253;720 255;590 253;430 255" dur="12s" repeatCount="indefinite"/></path>
